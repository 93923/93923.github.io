<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .rectangle {
            width: 200px;
            height: 200px;
            background-color: blue;
            border: 5px solid black; /* 加上邊框 */
            position: absolute;
            top: 50px;
            left: 50px;
        }
        .circle {
            width: 150px;
            height: 150px;
            background-color: yellow;
            border: 5px solid red;
            border-radius: 50%;
            position: absolute;
            top: 70px; /* 移上去一些 */
            left: 150px;
        }
    </style>
    <title>Circle and Rectangle</title>
</head>
<body>

    <div class="rectangle"></div>
    <div class="circle"></div>

</body>
</html>
